
services:
  frontend:
    build:
      context: ./frontend
    container_name: vue3
    restart: always
    env_file:
      - ./frontend/.env.docker
    ports:
      - "5173:5173"
    # Unete a la red existente de tu stack (ajusta el nombre si es distinto)
    networks:
      - integrador_default

networks:
  integrador_default:
    external: true
